<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d30">
  <title>Lista solidaria · 120 personas</title>
  <style>
    :root{--ink:#18342b;--muted:#60736b;--cream:#fbf8f1;--green:#0b9a61;--amber:#d88912;--line:#dce6e0}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#25a66917,transparent 34rem),var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,input{font:inherit}
    header{background:#123d30;color:#fff;padding:22px 16px 34px}.hero,.summary,.tools,#list,footer{width:min(calc(100% - 32px),860px);margin:auto}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px}
    small{color:#9de2be;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:7px 0 8px;font:clamp(2.1rem,8vw,4rem)/.95 Georgia,serif}.hero p{margin:0;color:#d8eee4}
    #image{min-height:48px;border:0;border-radius:999px;padding:12px 17px;background:#f1c85b;color:#25392f;font-weight:800;cursor:pointer}
    .summary{margin-top:-17px;padding:18px;border:1px solid #10463414;border-radius:20px;background:#fff;box-shadow:0 12px 35px #143a2e17}.row{display:flex;justify-content:space-between}.bar{height:10px;margin-top:13px;border-radius:99px;background:#e7ece9;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#4ac181);transition:.2s}.stats{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:13px;color:var(--muted);font-size:13px;font-weight:700}
    .tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 7px;color:var(--muted);font-size:14px;font-weight:700}.tools label{display:flex;align-items:center;gap:8px}.tools input{accent-color:var(--green)}.date{display:grid!important;gap:4px!important;font-size:12px}.date input,.date select{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;color:var(--ink)}#filter{width:19px;height:19px}#reset{border:0;background:transparent;color:#a04436;font-weight:800}
    section h2{margin:22px 0 8px;color:#08764b;font:1.3rem Georgia,serif}.cards{display:grid;gap:9px}.card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}.card.donated{border-color:#bce4cd;background:#eaf7ef}.card.partial{border-color:#efd69e;background:#fff4db}
    .check{width:40px;height:40px;border:2px solid #b6c3bd;border-radius:12px;background:#fff;color:#fff;font-weight:900}.donated .check{border-color:var(--green);background:var(--green)}.partial .check{border-color:var(--amber);background:var(--amber)}
    .content{min-width:0}.name,.note{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.name{font-weight:700}.note{margin-top:6px;padding:4px 0;border-bottom:1px solid #ddb968;color:#7c5413;font-size:14px}.pill{min-height:36px;border:0;border-radius:99px;padding:7px 11px;background:#edf0ee;color:#64736c;font-size:12px;font-weight:800}.donated .pill{background:#ccebd9;color:#087044}.partial .pill{background:#f4d99b;color:#86580d}
    footer{padding:30px 0 80px;color:var(--muted);font-size:13px;text-align:center}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(calc(100% - 32px),420px);padding:15px;border-radius:14px;background:#102d24;color:#fff;text-align:center;font-weight:700}
    @media(max-width:560px){.hero{display:block}#image{width:100%;margin-top:17px}.card{grid-template-columns:42px minmax(0,1fr)}.pill{grid-column:2;justify-self:start}}
  </style>
</head>
<body>
  <header><div class="hero"><div><small>Actividad semanal</small><h1>Lista solidaria</h1><p>Arroz relleno para <b id="populationText">120 personas</b></p></div><button id="image">↗ Generar imagen</button></div></header>
  <div class="summary"><div class="row"><span><b id="done">0 de 21</b> confirmados</span><b id="percent">0%</b></div><div class="bar"><i id="bar"></i></div><div class="stats" id="stats"></div></div>
  <div class="tools"><label class="date">Personas<select id="population"><option value="120">120 personas</option><option value="100">100 personas</option></select></label><label class="date">Fecha de la repartida<input id="distributionDate" type="date"></label><label><input id="filter" type="checkbox"> Solo pendientes</label><button id="reset">Reiniciar semana</button></div>
  <main id="list"></main>
  <footer>Toca el estado para cambiarlo. La lista se guarda automáticamente en este dispositivo.</footer>
  <script>
    const base120=[
      ["18 lb de pechugas de pollo","Ingredientes"],["6 lb de salchichas o chorizos","Ingredientes"],["30 huevos","Ingredientes"],["17 libras de arroz","Ingredientes"],["5 libras de arvejas","Ingredientes"],["5 libras de lenteja","Ingredientes"],["8 zanahorias amarillas","Ingredientes"],["8 pimientos verdes, 8 rojos y 8 amarillos","Ingredientes"],["1 lb de cebolla paiteña","Ingredientes"],["1 lb de cebolla blanca","Ingredientes"],["2 cabezas de ajo","Ingredientes"],["¼ de aceite para el refrito","Ingredientes"],["Achiote","Ingredientes"],["Sal","Ingredientes"],["120 panes redondos","Ingredientes"],["120 helados","Ingredientes"],
      ["Papel para cocina","Artículos de limpieza"],["Jabón para lavar platos","Artículos de limpieza"],["120 tarrinas","Artículos para empacar"],["120 cucharas desechables","Artículos para empacar"],["120 servilletas","Artículos para empacar"]
    ];
    const base100=[
      ["15 lb de pechugas de pollo","Ingredientes"],["5 lb de salchichas o chorizos","Ingredientes"],["30 huevos","Ingredientes"],["14 libras de arroz","Ingredientes"],["5 libras de arvejas","Ingredientes"],["6 zanahorias amarillas","Ingredientes"],["8 pimientos verdes, 8 rojos y 8 amarillos","Ingredientes"],["1 lb de cebolla paiteña","Ingredientes"],["1 lb de cebolla blanca","Ingredientes"],["2 cabezas de ajo","Ingredientes"],["¼ de aceite para el refrito","Ingredientes"],["Achiote","Ingredientes"],["Sal","Ingredientes"],["100 panes redondos","Ingredientes"],["100 helados (comprar a Kami Corral: 098 274 5243)","Ingredientes"],
      ["Papel para cocina","Artículos de limpieza"],["Jabón para lavar platos","Artículos de limpieza"],["100 tarrinas","Artículos para empacar"],["100 cucharas desechables","Artículos para empacar"],["100 servilletas","Artículos para empacar"]
    ];
    const cats=["Ingredientes","Artículos de limpieza","Artículos para empacar"],labels={pending:"Pendiente",donated:"Donado",partial:"Incompleto"},key=()=>`lista-solidaria-${population.value}-v1`,makeItems=base=>(base.map((x,i)=>({id:i+1,name:x[0],category:x[1],status:"pending",note:""})));
    let items;try{items=JSON.parse(localStorage.getItem("lista-solidaria-120-v1"))}catch(e){}if(!Array.isArray(items))items=makeItems(base120);
    const nextSaturday=()=>{const d=new Date(),n=(6-d.getDay()+7)%7;d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},formatDate=v=>v?new Intl.DateTimeFormat("es-EC",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T12:00:00")):"Fecha por confirmar";distributionDate.value=nextSaturday();
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function save(){localStorage.setItem(key(),JSON.stringify(items))}
    function cycle(id){const x=items.find(x=>x.id===id);x.status=x.status==="pending"?"donated":x.status==="donated"?"partial":"pending";if(x.status!=="partial")x.note="";save();render()}
    function render(){
      const confirmed=items.filter(x=>x.status!=="pending").length,donated=items.filter(x=>x.status==="donated").length,partial=items.filter(x=>x.status==="partial").length,p=Math.round(confirmed/items.length*100);
      done.textContent=`${confirmed} de ${items.length}`;percent.textContent=p+"%";bar.style.width=p+"%";stats.textContent=`● ${donated} donados   ● ${partial} incompletos   ● ${items.length-confirmed} pendientes`;
      const only=filter.checked;list.innerHTML=cats.map(cat=>{const group=items.filter(x=>x.category===cat&&(!only||x.status!=="donated"));if(!group.length)return"";return`<section><h2>${cat}</h2><div class="cards">${group.map(x=>`<article class="card ${x.status}"><button class="check" data-cycle="${x.id}" aria-label="Cambiar estado">${x.status==="donated"?"✓":x.status==="partial"?"½":""}</button><div class="content"><input class="name" data-name="${x.id}" value="${esc(x.name)}" aria-label="Ingrediente">${x.status==="partial"?`<input class="note" data-note="${x.id}" value="${esc(x.note)}" placeholder="¿Qué falta o cuánto fue donado?">`:""}</div><button class="pill" data-cycle="${x.id}">${labels[x.status]}</button></article>`).join("")}</div></section>`}).join("");
      document.querySelectorAll("[data-cycle]").forEach(b=>b.onclick=()=>cycle(+b.dataset.cycle));document.querySelectorAll("[data-name]").forEach(i=>i.onchange=()=>{items.find(x=>x.id==i.dataset.name).name=i.value;save()});document.querySelectorAll("[data-note]").forEach(i=>i.oninput=()=>{items.find(x=>x.id==i.dataset.note).note=i.value;save()});
    }
    population.onchange=()=>{const saved=localStorage.getItem(key());try{items=saved?JSON.parse(saved):makeItems(population.value==="120"?base120:base100)}catch(e){items=makeItems(population.value==="120"?base120:base100)}populationText.textContent=population.value+" personas";render()};
    filter.onchange=render;reset.onclick=()=>{if(confirm("¿Dejar todos los ingredientes como pendientes?")){items.forEach(x=>{x.status="pending";x.note=""});save();render()}};
    image.onclick=()=>{
      const W=1080,pad=54,rows=[];cats.forEach(c=>{const group=items.filter(x=>x.category===c&&(!filter.checked||x.status!=="donated"));if(!group.length)return;rows.push({cat:c,h:66});group.forEach(x=>rows.push({x,h:x.note?112:76}))});const H=175+rows.reduce((a,r)=>a+r.h,0)+50,c=document.createElement("canvas");c.width=W;c.height=H;const q=c.getContext("2d");q.fillStyle="#fffdf8";q.fillRect(0,0,W,H);q.textAlign="center";q.fillStyle="#153a2f";q.font="700 42px Georgia";q.fillText("Fecha de la repartida",W/2,62);q.fillStyle="#138a5b";q.font="700 34px Arial";q.fillText(formatDate(distributionDate.value),W/2,112);let y=145;q.textAlign="left";
      rows.forEach(r=>{if(r.cat){q.fillStyle="#e8f4ed";q.fillRect(pad,y,W-pad*2,r.h);q.fillStyle="#176b4b";q.font="700 30px Arial";q.fillText(r.cat,pad+22,y+42)}else{q.fillStyle=r.x.status==="donated"?"#f2faf5":r.x.status==="partial"?"#fff8e7":"#fff";q.fillRect(pad,y,W-pad*2,r.h);q.strokeStyle="#d7e0db";q.strokeRect(pad,y,W-pad*2,r.h);q.fillStyle="#1d2b26";q.font="28px Arial";q.fillText(r.x.name,pad+22,y+38,620);if(r.x.note){q.fillStyle="#8a5a10";q.font="23px Arial";q.fillText("Observación: "+r.x.note,pad+22,y+78,620)}q.fillStyle=r.x.status==="donated"?"#0a9b60":r.x.status==="partial"?"#d78a13":"#718078";q.fillRect(W-pad-220,y+16,195,42);q.fillStyle="#fff";q.font="700 22px Arial";q.textAlign="center";q.fillText(labels[r.x.status],W-pad-122,y+44);q.textAlign="left"}y+=r.h});const a=document.createElement("a");a.download=`lista-solidaria-${population.value}-personas.png`;a.href=c.toDataURL();a.click();const t=document.createElement("div");t.className="toast";t.textContent="Imagen descargada. Ya puedes compartirla.";document.body.append(t);setTimeout(()=>t.remove(),3000)
    };render();
  </script>
</body>
</html>
