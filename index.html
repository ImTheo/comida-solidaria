<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d30">
  <title>Lista solidaria · 120 personas</title>
  <style>
    :root{--ink:#18342b;--muted:#60736b;--cream:#fbf8f1;--green:#0b9a61;--amber:#d88912;--line:#dce6e0}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#25a66917,transparent 34rem),var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,input{font:inherit}
    header{background:#123d30;color:#fff;padding:22px 16px 34px}.hero,.summary,.tabs,.tools,#list,#shifts,footer{width:min(calc(100% - 32px),860px);margin:auto}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px}
    small{color:#9de2be;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:7px 0 8px;font:clamp(2.1rem,8vw,4rem)/.95 Georgia,serif}.hero p{margin:0;color:#d8eee4}
    .image-tools{display:flex;align-items:center;gap:14px}.image-tools label{display:flex;align-items:center;gap:7px;color:#d8eee4;font-size:14px;font-weight:700;white-space:nowrap}#filter{width:19px;height:19px;accent-color:#f1c85b}#image{min-height:48px;border:0;border-radius:999px;padding:12px 17px;background:#f1c85b;color:#25392f;font-weight:800;cursor:pointer}
    .summary{margin-top:-17px;padding:18px;border:1px solid #10463414;border-radius:20px;background:#fff;box-shadow:0 12px 35px #143a2e17}.row{display:flex;justify-content:space-between}.bar{height:10px;margin-top:13px;border-radius:99px;background:#e7ece9;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#4ac181);transition:.2s}.stats{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:13px;color:var(--muted);font-size:13px;font-weight:700}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:18px;padding:5px;border:1px solid var(--line);border-radius:14px;background:#eaf0ec}.tab{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#08764b;box-shadow:0 3px 12px #173b2e16}
    .tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 7px;color:var(--muted);font-size:14px;font-weight:700}.tools label{display:flex;align-items:center;gap:8px}.tools input{accent-color:var(--green)}.date{display:grid!important;gap:4px!important;font-size:12px}.date input,.date select{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;color:var(--ink)}#reset{border:0;background:transparent;color:#a04436;font-weight:800}
    section h2{margin:22px 0 8px;color:#08764b;font:1.3rem Georgia,serif}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;min-height:66px;padding:10px;border:1px solid #efc8c4;border-radius:14px;background:#fff1f0}.card.donated{border-color:#bce4cd;background:#eaf7ef}.card.partial{border-color:#efd69e;background:#fff4db}
    .check{width:40px;height:40px;border:2px solid #b6c3bd;border-radius:12px;background:#fff;color:#fff;font-weight:900}.donated .check{border-color:var(--green);background:var(--green)}.partial .check{border-color:var(--amber);background:var(--amber)}
    .content{min-width:0}.name,.note{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.name{font-weight:700}.note{margin-top:6px;padding:4px 0;border-bottom:1px solid #ddb968;color:#7c5413;font-size:14px}.pill{grid-column:2;justify-self:start;min-height:29px;border:0;border-radius:99px;padding:5px 9px;background:#f7d4d1;color:#963d36;font-size:11px;font-weight:800}.donated .pill{background:#ccebd9;color:#087044}.partial .pill{background:#f4d99b;color:#86580d}
    #shifts{display:none}.shift-intro{margin:22px 0 14px}.shift-intro h2{margin:0;color:#08764b;font:1.55rem Georgia,serif}.shift-intro p{margin:6px 0 0;color:var(--muted);font-size:14px}.shift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.shift-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.shift-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.shift-head h3{margin:0;font:1.15rem Georgia,serif}.shift-head span{padding:5px 9px;border-radius:99px;background:#eaf7ef;color:#087044;font-size:12px;font-weight:800}.shift-card p{margin:-5px 0 13px;color:var(--muted);font-size:12px}.person-row{display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:8px;margin-top:8px;color:#73837c;font-size:13px;font-weight:800}.person-row input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfdfc;color:var(--ink);outline:none}.person-row input:focus{border-color:#43af7c;box-shadow:0 0 0 3px #43af7c1c}.hidden{display:none!important}
    footer{padding:30px 0 80px;color:var(--muted);font-size:13px;text-align:center}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(calc(100% - 32px),420px);padding:15px;border-radius:14px;background:#102d24;color:#fff;text-align:center;font-weight:700}
    @media(max-width:560px){.hero{display:block}.image-tools{margin-top:17px;justify-content:space-between}#image{flex:1}.cards{gap:7px}.card{grid-template-columns:31px minmax(0,1fr);align-content:center;gap:5px;min-height:75px;padding:7px;border-radius:11px}.check{width:30px;height:30px;border-radius:9px}.name{font-size:12px}.note{font-size:11px}.pill{min-height:24px;padding:4px 7px;font-size:9px}.shift-grid{gap:8px}.shift-card{padding:10px}.shift-head{display:block}.shift-head span{display:inline-block;margin-top:7px}.shift-head h3{font-size:1rem}.shift-card p{min-height:28px;margin-top:0}.person-row{grid-template-columns:18px minmax(0,1fr);gap:3px}.person-row input{min-height:38px;padding:7px;font-size:13px}}
  </style>
</head>
<body>
  <header><div class="hero"><div><small>Actividad semanal</small><h1>Lista solidaria</h1><p>Arroz relleno para <b id="populationText">120 personas</b></p></div><div class="image-tools"><label><input id="filter" type="checkbox"> Solo pendientes</label><button id="image">↗ Generar imagen</button></div></div></header>
  <div class="summary"><div class="row"><span><b id="done">0 de 21</b> confirmados</span><b id="percent">0%</b></div><div class="bar"><i id="bar"></i></div><div class="stats" id="stats"></div></div>
  <nav class="tabs" aria-label="Secciones"><button class="tab active" id="ingredientsTab" aria-selected="true">Ingredientes</button><button class="tab" id="shiftsTab" aria-selected="false">Turnos</button></nav>
  <div class="tools"><label class="date">Personas<select id="population"><option value="120">120 personas</option><option value="100">100 personas</option></select></label><label class="date">Fecha de la repartida<input id="distributionDate" type="date"></label><button id="reset">Reiniciar semana</button></div>
  <main id="list"></main>
  <main id="shifts"><div class="shift-intro"><h2>Organización de turnos</h2><p>Asigna a las personas y carros disponibles para la jornada.</p></div><div class="shift-grid" id="shiftGrid"></div></main>
  <footer id="footerText">Toca el estado para cambiarlo. La lista se guarda automáticamente en este dispositivo.</footer>
  <script>
    const base120=[
      ["18 lb de pechugas de pollo","Ingredientes"],["6 lb de salchichas o chorizos","Ingredientes"],["30 huevos","Ingredientes"],["17 libras de arroz","Ingredientes"],["5 libras de arvejas","Ingredientes"],["5 libras de lenteja","Ingredientes"],["8 zanahorias amarillas","Ingredientes"],["8 pimientos verdes, 8 rojos y 8 amarillos","Ingredientes"],["1 lb de cebolla paiteña","Ingredientes"],["1 lb de cebolla blanca","Ingredientes"],["2 cabezas de ajo","Ingredientes"],["¼ de aceite para el refrito","Ingredientes"],["Achiote","Ingredientes"],["Sal","Ingredientes"],["120 panes redondos","Ingredientes"],["120 helados","Ingredientes"],
      ["Papel para cocina","Artículos de limpieza"],["Jabón para lavar platos","Artículos de limpieza"],["120 tarrinas","Artículos para empacar"],["120 cucharas desechables","Artículos para empacar"],["120 servilletas","Artículos para empacar"]
    ];
    const base100=[
      ["15 lb de pechugas de pollo","Ingredientes"],["5 lb de salchichas o chorizos","Ingredientes"],["30 huevos","Ingredientes"],["14 libras de arroz","Ingredientes"],["5 libras de arvejas","Ingredientes"],["6 zanahorias amarillas","Ingredientes"],["8 pimientos verdes, 8 rojos y 8 amarillos","Ingredientes"],["1 lb de cebolla paiteña","Ingredientes"],["1 lb de cebolla blanca","Ingredientes"],["2 cabezas de ajo","Ingredientes"],["¼ de aceite para el refrito","Ingredientes"],["Achiote","Ingredientes"],["Sal","Ingredientes"],["100 panes redondos","Ingredientes"],["100 helados (comprar a Kami Corral: 098 274 5243)","Ingredientes"],
      ["Papel para cocina","Artículos de limpieza"],["Jabón para lavar platos","Artículos de limpieza"],["100 tarrinas","Artículos para empacar"],["100 cucharas desechables","Artículos para empacar"],["100 servilletas","Artículos para empacar"]
    ];
    const cats=["Ingredientes","Artículos de limpieza","Artículos para empacar"],labels={pending:"Pendiente",donated:"Donado",partial:"Incompleto"},key=()=>`lista-solidaria-${population.value}-v1`,makeItems=base=>(base.map((x,i)=>({id:i+1,name:x[0],category:x[1],status:"pending",note:""})));
    const emptyShifts=()=>({responsible:[""],cooking:Array(6).fill(""),delivery:Array(6).fill(""),cars:Array(2).fill("")});
    let currentTab="ingredients",shiftData=emptyShifts();
    let items;try{items=JSON.parse(localStorage.getItem("lista-solidaria-120-v1"))}catch(e){}if(!Array.isArray(items))items=makeItems(base120);
    const nextSaturday=()=>{const d=new Date(),n=(6-d.getDay()+7)%7;d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},formatDate=v=>v?new Intl.DateTimeFormat("es-EC",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T12:00:00")):"Fecha por confirmar";distributionDate.value=localStorage.getItem("lista-solidaria-fecha")||nextSaturday();
    const shiftKey=()=>`lista-solidaria-turnos-${distributionDate.value||"sin-fecha"}-v1`;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function save(){localStorage.setItem(key(),JSON.stringify(items))}
    function loadShifts(){try{shiftData=JSON.parse(localStorage.getItem(shiftKey()))||emptyShifts()}catch(e){shiftData=emptyShifts()}["responsible","cooking","delivery","cars"].forEach((k,i)=>{const size=[1,6,6,2][i];if(!Array.isArray(shiftData[k]))shiftData[k]=Array(size).fill("");shiftData[k]=shiftData[k].slice(0,size);while(shiftData[k].length<size)shiftData[k].push("")});renderShifts()}
    function saveShifts(){localStorage.setItem(shiftKey(),JSON.stringify(shiftData))}
    function renderShifts(){
      const groups=[
        ["responsible","Responsable","Coordinación general",1],
        ["cars","Carros disponibles","Conductor o propietario",2],
        ["cooking","Cocinar y preparar tarrinas","De 3:30 p. m. a 7:00 p. m.",6],
        ["delivery","Repartir la comida","De 6:30 p. m. en adelante",6]
      ];
      shiftGrid.innerHTML=groups.map(g=>`<section class="shift-card ${g[0]==="responsible"?"responsible":""}"><div class="shift-head"><h3>${g[1]}</h3><span>${g[3]} ${g[0]==="cars"?(g[3]===1?"carro":"carros"):(g[3]===1?"persona":"personas")}</span></div><p>${g[2]}</p>${shiftData[g[0]].map((name,i)=>`<label class="person-row"><span>${i+1}.</span><input data-shift="${g[0]}" data-index="${i}" value="${esc(name)}" placeholder="${g[0]==="cars"?"Nombre / vehículo":"Nombre de la persona"}" aria-label="${g[1]} ${i+1}"></label>`).join("")}</section>`).join("");
      document.querySelectorAll("[data-shift]").forEach(input=>input.oninput=()=>{shiftData[input.dataset.shift][+input.dataset.index]=input.value;saveShifts()});
    }
    function selectTab(tab){currentTab=tab;const ingredients=tab==="ingredients";ingredientsTab.classList.toggle("active",ingredients);shiftsTab.classList.toggle("active",!ingredients);ingredientsTab.setAttribute("aria-selected",ingredients);shiftsTab.setAttribute("aria-selected",!ingredients);list.style.display=ingredients?"block":"none";shifts.style.display=ingredients?"none":"block";document.querySelector(".summary").classList.toggle("hidden",!ingredients);population.closest("label").classList.toggle("hidden",!ingredients);filter.closest("label").classList.toggle("hidden",!ingredients);reset.textContent=ingredients?"Reiniciar semana":"Limpiar turnos";footerText.textContent=ingredients?"Toca el estado para cambiarlo. La lista se guarda automáticamente en este dispositivo.":"Escribe los nombres de cada turno. Los cambios se guardan automáticamente por fecha."}
    function cycle(id){const x=items.find(x=>x.id===id);x.status=x.status==="pending"?"donated":x.status==="donated"?"partial":"pending";if(x.status!=="partial")x.note="";save();render()}
    function render(){
      const confirmed=items.filter(x=>x.status!=="pending").length,donated=items.filter(x=>x.status==="donated").length,partial=items.filter(x=>x.status==="partial").length,p=Math.round(confirmed/items.length*100);
      done.textContent=`${confirmed} de ${items.length}`;percent.textContent=p+"%";bar.style.width=p+"%";stats.textContent=`● ${donated} donados   ● ${partial} incompletos   ● ${items.length-confirmed} pendientes`;
      list.innerHTML=cats.map(cat=>{const group=items.filter(x=>x.category===cat);if(!group.length)return"";return`<section><h2>${cat}</h2><div class="cards">${group.map(x=>`<article class="card ${x.status}"><button class="check" data-cycle="${x.id}" aria-label="Cambiar estado">${x.status==="donated"?"✓":x.status==="partial"?"½":""}</button><div class="content"><input class="name" data-name="${x.id}" value="${esc(x.name)}" aria-label="Ingrediente">${x.status==="partial"?`<input class="note" data-note="${x.id}" value="${esc(x.note)}" placeholder="¿Qué falta o cuánto fue donado?">`:""}</div><button class="pill" data-cycle="${x.id}">${labels[x.status]}</button></article>`).join("")}</div></section>`}).join("");
      document.querySelectorAll("[data-cycle]").forEach(b=>b.onclick=()=>cycle(+b.dataset.cycle));document.querySelectorAll("[data-name]").forEach(i=>i.onchange=()=>{items.find(x=>x.id==i.dataset.name).name=i.value;save()});document.querySelectorAll("[data-note]").forEach(i=>i.oninput=()=>{items.find(x=>x.id==i.dataset.note).note=i.value;save()});
    }
    population.onchange=()=>{const saved=localStorage.getItem(key());try{items=saved?JSON.parse(saved):makeItems(population.value==="120"?base120:base100)}catch(e){items=makeItems(population.value==="120"?base120:base100)}populationText.textContent=population.value+" personas";render()};
    distributionDate.onchange=()=>{localStorage.setItem("lista-solidaria-fecha",distributionDate.value);loadShifts()};
    ingredientsTab.onclick=()=>selectTab("ingredients");shiftsTab.onclick=()=>selectTab("shifts");
    reset.onclick=()=>{if(currentTab==="ingredients"){if(confirm("¿Dejar todos los ingredientes como pendientes?")){items.forEach(x=>{x.status="pending";x.note=""});save();render()}}else if(confirm("¿Borrar todos los turnos de esta fecha?")){shiftData=emptyShifts();saveShifts();renderShifts()}};
    function downloadCanvas(c,name,message){const a=document.createElement("a");a.download=name;a.href=c.toDataURL();a.click();const t=document.createElement("div");t.className="toast";t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),3000)}
    function exportShifts(){
      const W=1200,pad=54,top=150,col=(W-pad*2-18)/2,c=document.createElement("canvas");c.width=W;c.height=900;const q=c.getContext("2d");q.fillStyle="#fffdf8";q.fillRect(0,0,W,c.height);q.textAlign="center";q.fillStyle="#153a2f";q.font="700 45px Georgia";q.fillText("Turnos de la jornada",W/2,62);q.fillStyle="#138a5b";q.font="700 29px Arial";q.fillText(formatDate(distributionDate.value),W/2,108);
      const box=(x,y,w,title,subtitle,names)=>{const row=55,h=105+names.length*row;q.fillStyle="#fff";q.strokeStyle="#d7e0db";q.lineWidth=2;q.beginPath();q.roundRect(x,y,w,h,16);q.fill();q.stroke();q.textAlign="left";q.fillStyle="#176b4b";q.font="700 27px Georgia";q.fillText(title,x+22,y+35,w-44);q.fillStyle="#718078";q.font="18px Arial";q.fillText(subtitle,x+22,y+65,w-44);names.forEach((name,i)=>{const ry=y+92+i*row;q.strokeStyle="#e2e9e5";q.beginPath();q.moveTo(x+20,ry+37);q.lineTo(x+w-20,ry+37);q.stroke();q.fillStyle="#73837c";q.font="700 18px Arial";q.fillText(`${i+1}.`,x+22,ry+25);q.fillStyle="#1d2b26";q.font="22px Arial";q.fillText(name||"—",x+55,ry+25,w-80)});return h};
      box(pad,top,col,"Responsable","Coordinación general",shiftData.responsible);box(pad+col+18,top,col,"Carros disponibles","Conductor o propietario",shiftData.cars);const y=top+235;box(pad,y,col,"Cocinar y preparar tarrinas","De 3:30 p. m. a 7:00 p. m.",shiftData.cooking);box(pad+col+18,y,col,"Repartir la comida","De 6:30 p. m. en adelante",shiftData.delivery);downloadCanvas(c,`turnos-${distributionDate.value||"sin-fecha"}.png`,"Imagen de turnos descargada. Ya puedes compartirla.")
    }
    image.onclick=()=>{
      if(currentTab==="shifts"){exportShifts();return}
      const W=1200,pad=45,gap=10,col=(W-pad*2-gap)/2,groups=cats.map(cat=>({cat,items:items.filter(x=>x.category===cat&&(!filter.checked||x.status!=="donated"))})).filter(g=>g.items.length);let contentH=0;groups.forEach(g=>{contentH+=60;for(let i=0;i<g.items.length;i+=2)contentH+=Math.max(...g.items.slice(i,i+2).map(x=>x.note?104:76))+gap});const H=155+contentH+35,c=document.createElement("canvas");c.width=W;c.height=H;const q=c.getContext("2d");q.fillStyle="#fffdf8";q.fillRect(0,0,W,H);q.textAlign="center";q.fillStyle="#153a2f";q.font="700 42px Georgia";q.fillText("Fecha de la repartida",W/2,55);q.fillStyle="#138a5b";q.font="700 31px Arial";q.fillText(formatDate(distributionDate.value),W/2,103);let y=135;q.textAlign="left";
      const drawItem=(x,y,w,h,item)=>{q.fillStyle=item.status==="donated"?"#f2faf5":item.status==="partial"?"#fff8e7":"#fff1f0";q.fillRect(x,y,w,h);q.strokeStyle=item.status==="pending"?"#efc8c4":"#d7e0db";q.strokeRect(x,y,w,h);q.fillStyle="#1d2b26";q.font="23px Arial";q.fillText(item.name,x+17,y+32,w-180);q.fillStyle=item.status==="donated"?"#0a9b60":item.status==="partial"?"#d78a13":"#c75c52";q.fillRect(x+w-146,y+13,130,34);q.fillStyle="#fff";q.font="700 16px Arial";q.textAlign="center";q.fillText(labels[item.status],x+w-81,y+36);q.textAlign="left";if(item.note){q.fillStyle="#8a5a10";q.font="18px Arial";q.fillText("Observación: "+item.note,x+17,y+72,w-34)}};
      groups.forEach(g=>{q.fillStyle="#e8f4ed";q.fillRect(pad,y,W-pad*2,52);q.fillStyle="#176b4b";q.font="700 26px Arial";q.fillText(g.cat,pad+18,y+34);y+=60;for(let i=0;i<g.items.length;i+=2){const pair=g.items.slice(i,i+2),h=Math.max(...pair.map(x=>x.note?104:76));pair.forEach((item,j)=>drawItem(pad+j*(col+gap),y,col,h,item));y+=h+gap}});downloadCanvas(c,`lista-solidaria-${population.value}-personas.png`,"Imagen descargada. Ya puedes compartirla.")
    };loadShifts();render();selectTab("ingredients");
  </script>
</body>
</html>
